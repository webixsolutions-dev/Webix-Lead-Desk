[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "webix-lead-desk"
version = "0.18.0"
description = "A private workspace for evidence-led research and reviewed outreach."
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "sqlalchemy>=2.0.36,<2.1",
  "alembic>=1.14,<2",
  "pydantic-settings>=2.7,<3",
  "jinja2>=3.1.5,<4",
  "python-multipart>=0.0.20,<1",
  "argon2-cffi>=23.1,<26",
  "itsdangerous>=2.2,<3",
  "psycopg[binary]>=3.2,<4",
  "tzdata>=2026.6",
  "cryptography>=44,<47",
  "dnspython>=2.7,<3",
]

[dependency-groups]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=6,<8",
  "httpx>=0.28,<1",
  "ruff>=0.11,<1",
  "mypy>=1.15,<2",
  "pre-commit>=4.1,<5",
]

[project.scripts]
lead-desk = "app.cli:main"

[tool.vercel]
entrypoint = "app.vercel:app"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["app", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["postgres: requires an isolated PostgreSQL test database"]

[tool.coverage.run]
source = ["app"]
omit = ["app/db/migrations/*"]

[tool.coverage.report]
show_missing = true
skip_empty = true
exclude_also = ["if __name__ == .__main__.:", "if TYPE_CHECKING:"]

