<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Verify sign-in · Webix Lead Desk</title><link rel="icon" href="/static/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="/static/app.css"><link rel="stylesheet" href="/static/readability.css?v=0.29"></head><body class="login-body"><main class="factor-layout"><section class="panel"><p class="eyebrow">WEBIX LEAD DESK</p><h1>Verify your sign-in</h1><p>Enter an unused authenticator code or one of your saved recovery codes. This sign-in check expires after five minutes.</p>{% if error %}<p class="notice error" role="alert">{{ error }}</p>{% endif %}<form method="post" action="/login/verify" class="work-form"><input type="hidden" name="csrf_token" value="{{ csrf }}"><label>Authenticator or recovery code<input name="code" autocomplete="one-time-code" maxlength="80" required autofocus></label><button class="button primary">Verify and sign in</button></form><p><a href="/login">Start sign-in again</a></p></section></main></body></html>
