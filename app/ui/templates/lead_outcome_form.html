{% if user.role == 'owner' and campaigns %}<details class="work-panel"><summary>Record the next action yourself</summary><form method="post" action="/leads/{{ company_record.id }}/outcome" class="work-form"><input type="hidden" name="csrf_token" value="{{ csrf }}"><label>Campaign<select name="campaign_id">{% for c in campaigns %}<option value="{{ c.id }}">{{ c.name }}</option>{% endfor %}</select></label><label>Next action<select name="decision"><option value="ask_first">Ask first · confirm their workflow</option><option value="recommend">Recommend one evidenced service</option><option value="research_more">Research more · name the checks</option><option value="revisit_later">Revisit later · choose a date</option><option value="no_clear_opportunity">No clear opportunity</option></select></label><label>Priority confidence · 1–10<input name="score" type="number" min="1" max="10" value="5" required></label><label>Reason<textarea name="reason" minlength="10" maxlength="1000" required></textarea></label><label>Service family · only for Ask first / Recommend<input name="service" maxlength="120"></label><label>Supporting observation<select name="evidence_id"><option value="">No service selected</option>{% for fact in evidence %}<option value="{{ fact.id }}">{{ fact.kind }} · {{ fact.source_url }}</option>{% endfor %}</select></label><label>What was observed<textarea name="observation" maxlength="400"></textarea></label><label>One question to ask<textarea name="owner_question" maxlength="500"></textarea></label><label>Still to confirm · one item per line<textarea name="needs_confirmation" maxlength="3000"></textarea></label><label>Named research checks · for Research more<textarea name="research_checks" maxlength="4000"></textarea></label><label>Revisit date · for Revisit later<input name="revisit_on" type="date"></label><label class="checkbox-row"><input type="checkbox" name="verified" value="true" required>I reviewed the actual evidence and remaining uncertainty.</label><button class="button secondary">Save reviewed next action</button></form></details>{% endif %}
