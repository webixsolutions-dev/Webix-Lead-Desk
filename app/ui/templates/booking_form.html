<form method="post" action="/bookings" class="work-form"><input type="hidden" name="csrf_token" value="{{ csrf }}"><input type="hidden" name="booking_id" value="{{ b.id if b else '' }}"><input type="hidden" name="version" value="{{ b.version if b else 0 }}"><label>Business<select name="company_id" required>{% for c in companies %}<option value="{{ c.id }}" {% if (b and b.company_id==c.id) or (not b and selected_company==c.id) %}selected{% endif %}>{{ c.name }}</option>{% endfor %}</select></label><label>Title<input name="title" value="{{ b.title if b else '' }}" maxlength="160" required></label><div class="form-columns"><label>Contact name / email<input name="contact" value="{{ b.contact if b else '' }}" maxlength="254" required></label><label>Real meeting host<input name="host" value="{{ b.host if b else '' }}" maxlength="160" required></label></div><div class="form-columns"><label>Proposed local date and time<input name="starts_at" type="datetime-local" value="{{ row.edit_time if b else '' }}" required></label><label>Timezone (IANA)<input name="timezone" value="{{ b.timezone if b else preferences.display_timezone }}" required></label><label>Minutes<input name="minutes" type="number" min="10" max="240" value="{{ row.minutes if b else 30 }}" required></label></div><label>Meeting type<select name="mode">{% for value,label in [('video','Video call'),('phone','Phone call'),('in_person','In-person meeting')] %}<option value="{{ value }}" {% if b and b.mode==value %}selected{% endif %}>{{ label }}</option>{% endfor %}</select></label><label>Actual video link, phone or meeting address<input name="location" maxlength="2000" value="{{ b.location if b else '' }}"></label><label>Source and notes<textarea name="note" maxlength="2000">{{ b.note if b else '' }}</textarea></label><button class="button primary">Save proposed booking</button><p class="small muted">Saving an edit removes confirmation. No invitation or email is sent.</p></form>
