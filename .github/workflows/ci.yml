name: Quality checks

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, types and offline tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: "0.13.5"
          enable-cache: true
      - run: uv sync --frozen --group dev
      - run: uv run ruff check app tests scripts
      - run: uv run ruff format --check app tests scripts
      - run: uv run mypy app tests scripts
      - run: uv run pytest -m "not postgres" --cov=app --cov-report=term-missing --cov-report=xml --cov-fail-under=80
      - run: uv run python scripts/check_coverage.py

  accessibility:
    name: Desktop and mobile readability
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff
        with:
          version: "0.13.5"
      - run: uv sync --frozen --group dev
      - run: uv run python -m scripts.ui_fixtures
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
      - run: npm ci --ignore-scripts
        working-directory: ui-tests
      # The hosted Ubuntu image already includes Chromium's system libraries.
      - run: npx playwright install chromium --only-shell
        working-directory: ui-tests
      - run: npm test
        working-directory: ui-tests
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: synthetic-readability-captures
          path: screenshots/ui-checks/
          retention-days: 14
          if-no-files-found: error

  postgres:
    name: PostgreSQL migrations
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: lead_desk_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d lead_desk_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: "0.13.5"
          enable-cache: true
      - run: uv sync --frozen --group dev
      - run: uv run pytest -m postgres
        env:
          TEST_DATABASE_URL: postgresql+psycopg://postgres@127.0.0.1:5432/lead_desk_test

  windows:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.base_ref == 'main')
    name: Windows setup smoke test
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: "0.13.5"
          enable-cache: true
      - run: uv sync --frozen --group dev
      - run: uv run python scripts/setup_local.py
      - run: powershell -NoProfile -File scripts/install-autostart.ps1 -ValidateOnly
      - run: uv run lead-desk migrate
      - run: uv run lead-desk enqueue-health
      - run: uv run lead-desk worker --once
      - run: uv run pytest tests/test_dashboard.py tests/test_configuration.py

  secrets:
    name: Gitleaks secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Install checksum-verified Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          version=8.24.3
          archive="gitleaks_${version}_linux_x64.tar.gz"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${version}"
          cd "$RUNNER_TEMP"
          if curl --fail --silent --show-error --location --retry 2 --retry-delay 2 --retry-max-time 30 "$base/$archive" --output "$archive" &&
             curl --fail --silent --show-error --location --retry 2 --retry-delay 2 --retry-max-time 30 "$base/gitleaks_${version}_checksums.txt" --output checksums.txt; then
            awk -v archive="$archive" '$2 == archive {print}' checksums.txt | sha256sum --check --strict
            tar -xzf "$archive" gitleaks
          else
            # The release CDN can be unavailable. Build the same pinned version
            # through Go's checksum-verified public module proxy; never skip scanning.
            GOBIN="$RUNNER_TEMP" GOPROXY=https://proxy.golang.org GOSUMDB=sum.golang.org \
              go install "github.com/zricethezav/gitleaks/v8@v${version}"
          fi
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - run: gitleaks git --redact --log-opts="--all"

  installer:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.base_ref == 'main')
    name: Build and test Windows installer
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff
        with:
          version: "0.13.5"
          enable-cache: true
      - run: uv sync --frozen --group dev --group packaging
      - run: uv run pytest tests/test_desktop.py -q
      - run: uv run python scripts/build_windows.py
      - name: Build offline installer
        shell: pwsh
        run: |
          $version = uv run python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])"
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" packaging/windows/setup.iss
          if ($LASTEXITCODE -ne 0) { throw "Installer compilation failed" }
      - name: Install, exercise packaged app, upgrade and uninstall
        shell: pwsh
        run: |
          $setup = (Get-ChildItem dist/installer/*.exe).FullName
          $target = Join-Path $env:RUNNER_TEMP 'WebixInstalled'
          $process = Start-Process $setup -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/DIR=$target" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Installation failed" }
          $report = Join-Path $env:RUNNER_TEMP 'desktop-smoke.json'
          $process = Start-Process "$target/WebixLeadDesk.exe" -ArgumentList '--smoke-test',"`"$report`"" -PassThru
          if (-not $process.WaitForExit(120000)) { $process.Kill(); throw "Packaged smoke timed out" }
          if ($process.ExitCode -ne 0 -or -not (Test-Path $report)) { throw "Packaged smoke failed" }
          $result = Get-Content $report -Raw | ConvertFrom-Json
          if (-not $result.ok) { throw "Packaged smoke failed" }
          $privateDir = Join-Path $env:LOCALAPPDATA 'WebixLeadDesk'
          New-Item -ItemType Directory -Force $privateDir | Out-Null
          $sentinel = Join-Path $privateDir 'upgrade-check.txt'
          Set-Content $sentinel 'synthetic preservation probe'
          $process = Start-Process $setup -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/DIR=$target" -Wait -PassThru
          if ($process.ExitCode -ne 0 -or -not (Test-Path $sentinel)) { throw "Upgrade preservation failed" }
          $process = Start-Process "$target/unins000.exe" -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait -PassThru
          if ($process.ExitCode -ne 0 -or -not (Test-Path $sentinel)) { throw "Uninstall preservation failed" }
          Remove-Item $sentinel
          Get-FileHash $setup -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $([IO.Path]::GetFileName($_.Path))" } | Set-Content dist/installer/SHA256SUMS.txt
      - name: Capture synthetic UI screenshot
        run: uv run python scripts/desktop_screenshot.py dist/installer/Desktop.png
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-installer
          path: dist/installer/
          retention-days: 14
          if-no-files-found: error

  phase-tag:
    name: Tag verified phase
    needs: [quality, postgres, windows, secrets, installer, accessibility]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Create the verified version tag once
        shell: bash
        run: |
          set -euo pipefail
          phase_tag="$(python3 -c 'import tomllib; print("v" + tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          if [[ ! "$phase_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            exit 1
          fi
          if git show-ref --verify --quiet "refs/tags/$phase_tag"; then
            exit 0
          fi
          git tag "$phase_tag" "$GITHUB_SHA"
          git push origin "refs/tags/$phase_tag"


  desktop-release:
    name: Publish verified Windows setup
    needs: [phase-tag, installer]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Publish installer and checksum
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="$(python3 -c 'import tomllib; print("v" + tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          gh run download "$GITHUB_RUN_ID" --name windows-installer --dir installer
          gh release create "$tag" installer/*.exe installer/SHA256SUMS.txt installer/Desktop.png --verify-tag --title "Webix Lead Desk $tag — Windows setup" --notes-file docs/windows-release-notes.md
