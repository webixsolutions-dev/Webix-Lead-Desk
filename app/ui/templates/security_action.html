<form method="post" action="/settings/security/{{ security_action }}" class="work-form"><input type="hidden" name="csrf_token" value="{{ csrf }}"><label>Current password<input type="password" name="password" autocomplete="current-password" maxlength="256" required></label>{% if enabled %}<label>Authenticator or recovery code<input name="code" autocomplete="one-time-code" maxlength="80" required></label><p class="small">A code can be used once. Wait for a new authenticator code if you just used one.</p>{% endif %}<label class="checkbox-row"><input type="checkbox" name="confirmed" value="true" required>I want to {{ security_label|lower }}.</label><button class="button secondary">{{ security_label }}</button></form>
